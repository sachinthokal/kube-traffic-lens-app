name: KUBE TRAFFIC LENS CICD
on:
  push:
    branches: [main]
    # tags: ['v*.*.*']

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  code-quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          fetch-depth: 0

      - name: Set Up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade --only-binary :all: pip==24.0
          pip install --only-binary :all: -r requirements.txt

      # 1. GitLeaks Scan Step
      - name: GitLeaks Checks
        id: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. Lint Step
      - name: Lint Python App
        id: pylint
        run: python -m pylint app.py tests/

      # 3. SonarQube Scan Step
      - name: SonarQube Scan
        id: sonarqube
        uses: sonarsource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4  # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      # 5.Summary Step: every step status/result
      - name: Build Execution Summary
        if: always()
        run: |
          echo "### 📊 Pipeline Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Pipeline Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          # echo "| **Code Checkout** | ${{ steps.checkout.outcome == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          # echo "| **Python Setup** | ${{ steps.setup-python.outcome == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          # echo "| **Dependencies Installation** | ${{ steps.install-deps.outcome == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **GitLeaks Security Check** | ${{ steps.gitleaks.outcome == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Pylint Code Linting** | ${{ steps.pylint.outcome == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          # echo "| **PyTest Unit Tests** | ${{ steps.pytest.outcome == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **SonarQube Quality Gate** | ${{ steps.sonarqube.outcome == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY

  code-build:
    name: Build, Scan, Test, Sign & Push
    runs-on: ubuntu-latest
    needs: code-quality
    outputs:
      digest: ${{ steps.docker-build-push.outputs.digest }}
      semver_version: ${{ steps.vars.outputs.semver_version }}
    steps:
      - name: Code Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Generate App Versions
        id: vars
        run: |
          SEMVER_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_VERSION="${SEMVER_VERSION}-${SHORT_SHA}"

          echo "semver_version=${SEMVER_VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_version=${BUILD_VERSION}" >> "$GITHUB_OUTPUT"

          echo "Semantic Version : ${SEMVER_VERSION}"
          echo "Commit SHA       : ${SHORT_SHA}"
          echo "Build Version    : ${BUILD_VERSION}"

      - name: Build Docker Image Locally
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: kube-traffic-lens-app:test
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.semver_version }}

      - name: Run Trivy Vulnerability Scanner
        id: trivy-scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kube-traffic-lens-app:test
          format: table
          exit-code: "1"
          severity: "CRITICAL,HIGH"

      - name: Run Container Smoke Test
        id: smoke-test
        run: |
          set -euo pipefail

          docker run -d \
            --name test-container \
            -p 8080:8080 \
            kube-traffic-lens-app:test

          trap 'docker rm -f test-container >/dev/null 2>&1 || true' EXIT

          echo "Waiting for application..." 
          sleep 5

          echo "Running smoke test..." 
          curl --fail --retry 5 --retry-delay 2 http://localhost:8080/

          docker stop test-container

          echo "Smoke test passed."

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Multi-Tag Docker Image
        id: docker-build-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.semver_version }}
          tags: |
            ${{ vars.DOCKER_USERNAME }}/kube-traffic-lens-app:${{ steps.vars.outputs.semver_version }}
            ${{ vars.DOCKER_USERNAME }}/kube-traffic-lens-app:${{ steps.vars.outputs.build_version }}
            ${{ vars.DOCKER_USERNAME }}/kube-traffic-lens-app:latest

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign Docker Image with Cosign
        id: cosign-sign
        env:
          IMAGE_DIGEST: ${{ vars.DOCKER_USERNAME }}/kube-traffic-lens-app@${{ steps.docker-build-push.outputs.digest }}
          COSIGN_YES: "true"
        run: |
          echo "Signing image digest:"
          echo "${IMAGE_DIGEST}"

          cosign sign "${IMAGE_DIGEST}"

      # SUMMARY REPORT
      - name: Publish Build Summary
        if: always()
        run: |
          echo "### 🐳 Docker Build, Scan, Test & Sign Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Semantic Version | ${{ steps.vars.outputs.semver_version }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit SHA | ${{ steps.vars.outputs.short_sha }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build Version | ${{ steps.vars.outputs.build_version }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image Digest | ${{ steps.docker-build-push.outputs.digest }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Trivy Scan | ${{ steps.trivy-scan.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Smoke Test | ${{ steps.smoke-test.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Cosign Sign | ${{ steps.cosign-sign.outcome == 'success' && '✅ Signed' || '❌ Failed' }} |" >> "$GITHUB_STEP_SUMMARY"

  code-tests:
    name: Code Automated Tests
    runs-on: ubuntu-latest
    needs: code-build
    steps:
      - name: Code Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          fetch-depth: 0

      - name: Set Up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade --only-binary :all: pip==24.0
          pip install --only-binary :all: -r requirements.txt

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify Docker Image Signature
        id: cosign-verify
        env:
          IMAGE_DIGEST: ${{ vars.DOCKER_USERNAME }}/kube-traffic-lens-app@${{ needs.code-build.outputs.digest }}
        run: |
          echo "Verifying image:"
          echo "${IMAGE_DIGEST}"
          cosign verify \
            "${IMAGE_DIGEST}" \
            --certificate-identity-regexp='https://github.com/sachinthokal/kube-traffic-lens-app/.github/workflows/kube-lens-deployment.yaml@refs/heads/main' \
            --certificate-oidc-issuer='https://token.actions.githubusercontent.com'

      - name: Test Cases Python App
        id: pytest
        run: python -m pytest -v

      - name: Build Execution Summary
        if: always()
        run: |
          echo "### 📊 Pipeline Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Pipeline Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **PyTest Unit Tests** | ${{ steps.pytest.outcome == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Cosign Verify** | ${{ steps.cosign-verify.outcome == 'success' && '✅ Verified' || '❌ Failed' }} |" >> "$GITHUB_STEP_SUMMARY"

  update-chart:
    name: Update Helm Chart
    runs-on: ubuntu-latest
    needs:
      - code-tests
      - code-build
    steps:
      - name: Code Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          repository: 'sachinthokal/helm-for-devops'
          ref: 'main' # branch name or tag name
          token: ${{ secrets.GIT_PAT }}

      - name: Setup Helm
        id: helm-install
        uses: azure/setup-helm@5119fcb9089d432beecbf79bb2c7915207344b78   # v3.19.0
        with:
          version: v3.19.0
        env:
          GITHUB_TOKEN: ${{ github.token }} 

      - name: Verify yq
        run: |
          yq --version

      - name: Replace Image Tag in Helm Chart
        id: helm-update
        run: |

          # Helm Chart Update with new image tag and version
          APP_VERSION="${{ needs.code-build.outputs.semver_version }}"

          echo "Updating Helm chart with new image tag: ${APP_VERSION}"

          # 1. APP & Chart Version without 'v' (e.g. 1.0.0)
          CHART_VER="${APP_VERSION#v}"
          APP_VER="${APP_VERSION#v}"

          # 2. IMAGE TAG with 'v' (e.g. v1.0.0)
          IMAGE_TAG="${APP_VERSION}"

          export CHART_VER APP_VER IMAGE_TAG APP_VERSION

          echo "# A. Update chart and app versions in Chart.yaml"
          yq eval -i '.version = strenv(CHART_VER)' charts/kube-traffic-lens/Chart.yaml
          yq eval -i '.appVersion = strenv(APP_VER)' charts/kube-traffic-lens/Chart.yaml

          echo "# B. Update image tag in values.yaml"
          yq eval -i '.image.tag = strenv(IMAGE_TAG)' charts/kube-traffic-lens/values.yaml

          echo "# C. Update APP_VERSION in env in values.yaml"
          yq eval -i '(.env[] | select(.name == "APP_VERSION") | .value) = strenv(APP_VERSION)' charts/kube-traffic-lens/values.yaml
          
      
      # Git config & Push
      - name: Configure Git and Push Changes
        id: git-push
        run: |
          APP_VERSION="${{ needs.code-build.outputs.semver_version }}"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git status

          git add charts/kube-traffic-lens/Chart.yaml \
                  charts/kube-traffic-lens/values.yaml

          # Check if there are any changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit."
            echo "status=no-changes" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(ci): update chart version and image tag ${APP_VERSION}"
            git push

            echo "status=updated-and-pushed" >> "$GITHUB_OUTPUT"
          fi

      # Pipeline Summary
      - name: Build Execution Summary
        if: always()
        run: |
          echo "### 🚀 Helm Chart Update Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Pipeline Step | Status | Details |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :--- | :--- | :--- |" >> "$GITHUB_STEP_SUMMARY"

          echo "| Helm Chart Update | ${{ steps.helm-update.outcome == 'success' && '✅ Success' || '❌ Failed' }} | Chart & application versions updated |" >> "$GITHUB_STEP_SUMMARY"

          if [[ "${{ steps.git-push.outputs.status }}" == "updated-and-pushed" ]]; then
            echo "| Git Commit & Push | ✅ Success | Changes committed and pushed to main |" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "${{ steps.git-push.outputs.status }}" == "no-changes" ]]; then
            echo "| Git Commit & Push | ℹ️ No Changes | Helm chart already up to date |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Git Commit & Push | ❌ Failed | Commit or push operation failed |" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "#### 📦 Version Information" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :--- | :--- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Application Version | \`${{ needs.code-build.outputs.semver_version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Helm Chart | \`kube-traffic-lens\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Target Branch | \`main\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Target Repository | \`sachinthokal/helm-for-devops\` |" >> "$GITHUB_STEP_SUMMARY"
  
  deploy-stage:
    name: Stage Deployments
    runs-on: ubuntu-latest
    needs: update-chart
    steps:
      - name : Stage Deployment
        run: echo "code deployment on stage env"   

  approvals-gates:
    name: Prod Approvals Gates
    environment: production
    runs-on: ubuntu-latest
    needs: deploy-stage
    steps:
      - name: Quality & Approvals Checks
        run: echo "code quality and approval checks before going to live"

  deploy-prod:
    name: Production Deployments
    runs-on: ubuntu-latest
    needs: approvals-gates
    steps:
      - name: Deploy On Production Env
        run: echo "code deployment on production env"

  cicd-summary:
    name: DevSecOps CICD Summary
    runs-on: ubuntu-latest
    needs: deploy-prod
    steps:
      - name: DevSecOps CICD Summary
        run: echo "DevSecOps CICD Summary"
  