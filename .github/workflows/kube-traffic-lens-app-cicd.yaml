name: KUBE TRAFFIC LENS CICD
on:
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  code-quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          fetch-depth: 0

      - name: Set Up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade --only-binary :all: pip==24.0
          pip install --only-binary :all: -r requirements.txt

      # 1. GitLeaks Scan Step
      - name: GitLeaks Checks
        id: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. Lint Step
      - name: Lint Python App
        id: pylint
        run: python -m pylint app.py tests/

      # 3. SonarQube Scan Step
      - name: SonarQube Scan
        id: sonarqube
        uses: sonarsource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4  # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      # 5.Summary Step: every step status/result
      - name: Build Execution Summary
        if: always()
        run: |
          echo "### 📊 Pipeline Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Pipeline Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          # echo "| **Code Checkout** | ${{ steps.checkout.outcome == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          # echo "| **Python Setup** | ${{ steps.setup-python.outcome == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          # echo "| **Dependencies Installation** | ${{ steps.install-deps.outcome == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **GitLeaks Security Check** | ${{ steps.gitleaks.outcome == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Pylint Code Linting** | ${{ steps.pylint.outcome == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          # echo "| **PyTest Unit Tests** | ${{ steps.pytest.outcome == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **SonarQube Quality Gate** | ${{ steps.sonarqube.outcome == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY

  code-build:
    name: Code Build & Push
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Code Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          fetch-depth: 0

      - name: Set Up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade --only-binary :all: pip==24.0
          pip install --only-binary :all: -r requirements.txt

      - name: Build and Push Multi-Tag Docker Image
        id: docker-build
        run: |
          # 1. Semantic Version fetch (Tag fallback v1.0.0)
          SEMVER_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")

          # 2. Short Commit Hash
          SHORT_SHA=$(git rev-parse --short HEAD)

          # 3. Combined Build Version
          BUILD_VERSION="${SEMVER_VERSION}-${SHORT_SHA}"

          # 4. Export step outputs
          echo "semver_version=${SEMVER_VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_version=${BUILD_VERSION}" >> "$GITHUB_OUTPUT"

          echo "Building with tags:"
          echo " - SemVer: ${SEMVER_VERSION}"
          echo " - Commit SHA: ${SHORT_SHA}"
          echo " - Build Version: ${BUILD_VERSION}"
          echo " - Latest"

          # 5. Docker build with multiple tags
          docker build \
            --build-arg APP_VERSION="${BUILD_VERSION}" \
            -t kube-traffic-lens:"${SEMVER_VERSION}" \
            -t kube-traffic-lens:"${BUILD_VERSION}" \
            -t kube-traffic-lens:latest .

      - name: Publish Build Summary
        if: always()
        run: |
          echo "### 🐳 Docker Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Semantic Version | ${{ steps.docker-build.outputs.semver_version }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit SHA | ${{ steps.docker-build.outputs.short_sha }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build Version | ${{ steps.docker-build.outputs.build_version }} |" >> "$GITHUB_STEP_SUMMARY"

  code-tests:
    name: Code Automated Tests
    runs-on: ubuntu-latest
    needs: code-build
    steps:
      - name: Code Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          fetch-depth: 0

      - name: Set Up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade --only-binary :all: pip==24.0
          pip install --only-binary :all: -r requirements.txt

      - name: Test Cases Python App
        id: pytest
        run: python -m pytest -v

      - name: Build Execution Summary
        if: always()
        run: |
          echo "### 📊 Pipeline Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Pipeline Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **PyTest Unit Tests** | ${{ steps.pytest.outcome == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY

  deploy-stage:
    name: Stage Deployments
    runs-on: ubuntu-latest
    needs: code-tests
    steps:
      - name: Deploy On Stage Env
        run: echo "code deployment on stage env"

  approvals-gates:
    name: Prod Approvals Gates
    environment: production
    runs-on: ubuntu-latest
    needs: deploy-stage
    steps:
      - name: Quality & Approvals Checks
        run: echo "code quality and approval checks before going to live"

  deploy-prod:
    name: Production Deployments
    runs-on: ubuntu-latest
    needs: approvals-gates
    steps:
      - name: Deploy On Production Env
        run: echo "code deployment on production env"

  cicd-summary:
    name: DevSecOps CICD Summary
    runs-on: ubuntu-latest
    needs: deploy-prod
    steps:
      - name: DevSecOps CICD Summary
        run: echo "DevSecOps CICD Summary"
  